services:
  file-manager:
    build: .
    ports:
      - "5000:5000"
    restart: always
    volumes:
      - ./uploads:/app/uploads
      - ./users.db:/app/users.db
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
  nginx:
    build:./nginx
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    depends_on:
      - file-manager
    ports:
      - "80:80"
      - "443:443"
    restart:always
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ivangabisev956@gmail.com --agree-tos --no-eff-email -d m1st1xx.mooo.com
volumes:
  certbot-etc:
  certbot-var:
  webroot:
