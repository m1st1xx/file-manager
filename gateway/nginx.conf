# Gateway: единая точка входа в приложение. Внешний nginx (с SSL) по-прежнему
# проксирует на http://file-manager:5000, а здесь запросы распределяются
# по микросервисам. Список маршрутов совпадает с services/common/web.py.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    client_max_body_size 500M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # DNS Docker: имена сервисов резолвятся заново, поэтому пересоздание
    # контейнера сервиса (новый IP) не ломает gateway
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 5000;

        set $auth_service  http://auth-service:5000;
        set $web_service   http://web-service:5000;
        set $files_service http://files-service:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Межсервисное API наружу не публикуется
        location /internal/ {
            return 404;
        }

        location /static/ {
            alias /usr/share/nginx/static/;
            expires 7d;
        }

        # auth-service
        location = /               { proxy_pass $auth_service; }
        location = /register       { proxy_pass $auth_service; }
        location = /login          { proxy_pass $auth_service; }
        location = /old_login      { proxy_pass $auth_service; }
        location = /set_username   { proxy_pass $auth_service; }
        location = /reset_password { proxy_pass $auth_service; }
        location = /logout         { proxy_pass $auth_service; }

        # files-service: предметы, загрузка, скачивание, удаление файлов
        location /subjects         { proxy_pass $files_service; }
        location /download         { proxy_pass $files_service; }
        location /upload           {
            proxy_pass $files_service;
            proxy_request_buffering off;
        }
        location /delete_file/     { proxy_pass $files_service; }

        # web-service: главная страница и всё остальное
        location / {
            proxy_pass $web_service;
        }
    }
}
