name: Deploy server

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q services migration

      - name: Check nginx gateway config
        run: |
          docker run --rm \
            --add-host auth-service:127.0.0.1 \
            --add-host web-service:127.0.0.1 \
            --add-host files-service:127.0.0.1 \
            -v "$PWD/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            set -e

            cd ${{ secrets.PROJECT_PATH }}

            git fetch file-manager main
            git reset --hard file-manager/main

            sudo docker compose up -d --build --remove-orphans

            sudo docker image prune -f
